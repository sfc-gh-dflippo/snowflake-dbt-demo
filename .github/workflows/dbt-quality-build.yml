name: dbt-quality native binaries

# Builds and tests the dbt-quality copy that
# .claude/plugins/dbt-quality-src/scripts/sync-from-upstream.sh brings in from migrations-ai-skills.
# The plugin root (.claude/plugins/dbt-quality) is outside the source tree, so every job sets
# DBT_QUALITY_PLUGIN_DIR for the scripts.

on:
  workflow_dispatch:
  # dbt-quality-release.yml calls this workflow, so a release ships only tested archives.
  workflow_call:
  push:
    # Tags are built by dbt-quality-release.yml through workflow_call.
    branches: ["**"]
    paths:
      - .claude/plugins/dbt-quality-src/**
      - .claude/plugins/dbt-quality/**
      - .gitmodules
      - .github/workflows/dbt-quality-build.yml
  pull_request:
    paths:
      - .claude/plugins/dbt-quality-src/**
      - .claude/plugins/dbt-quality/**
      - .gitmodules
      - .github/workflows/dbt-quality-build.yml

permissions:
  contents: read

concurrency:
  group: dbt-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The five targets run as two parallel job sets: `test` (tests, plus Clippy on one Unix and the
  # Windows target) and `package` (release build, archive, extracted-package smoke test). A release
  # needs both to pass. Each set has its own cache so debug and release outputs do not share one
  # large cache that is slow to save.
  test:
    name: test ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            clippy: true
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            clippy: false
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            clippy: false
          - runner: macos-15
            target: aarch64-apple-darwin
            clippy: false
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
            clippy: true
    defaults:
      run:
        shell: pwsh
        working-directory: .claude/plugins/dbt-quality-src
    env: &rust-env
      DBT_QUALITY_PLUGIN_DIR: ${{ github.workspace }}/.claude/plugins/dbt-quality
      RUSTUP_TOOLCHAIN: "1.96"
      CARGO_TERM_COLOR: always
      # CI builds are never reused incrementally; debug info only makes them slower and larger.
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      GIT_CONFIG_COUNT: "2"
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: "false"
      GIT_CONFIG_KEY_1: core.longpaths
      GIT_CONFIG_VALUE_1: "true"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          submodules: true
      - name: Install Linux native toolchain
        if: runner.os == 'Linux'
        shell: bash
        run: sudo apt-get update -qq && sudo apt-get install -y musl-tools build-essential
      - name: Install pinned Rust target
        run: |
          rustup toolchain install 1.96 --profile minimal --component clippy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup target add --toolchain 1.96 '${{ matrix.target }}'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .claude/plugins/dbt-quality-src/rust/target
          key:
            dbt-quality-test-${{ matrix.target }}-rust196-${{
            hashFiles('.claude/plugins/dbt-quality-src/rust/Cargo.lock',
            '.claude/plugins/dbt-quality-src/rust/**/Cargo.toml') }}
          restore-keys: dbt-quality-test-${{ matrix.target }}-rust196-
      - name: Tests on target
        run: |
          cargo +1.96 test --locked --manifest-path rust/Cargo.toml --target '${{ matrix.target }}' --workspace --no-fail-fast
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # The code has Windows-only and Unix-only cfg blocks; one target of each covers them.
      - name: Strict Clippy
        if: matrix.clippy
        run: |
          cargo +1.96 clippy --locked --manifest-path rust/Cargo.toml --target '${{ matrix.target }}' --workspace --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  package:
    name: package ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
    defaults:
      run:
        shell: pwsh
        working-directory: .claude/plugins/dbt-quality-src
    env: *rust-env
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          submodules: true
      - name: Install Linux native toolchain
        if: runner.os == 'Linux'
        shell: bash
        run: sudo apt-get update -qq && sudo apt-get install -y musl-tools build-essential
      - name: Install pinned Rust target
        run: |
          rustup toolchain install 1.96 --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup target add --toolchain 1.96 '${{ matrix.target }}'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .claude/plugins/dbt-quality-src/rust/target
          key:
            dbt-quality-release-${{ matrix.target }}-rust196-${{
            hashFiles('.claude/plugins/dbt-quality-src/rust/Cargo.lock',
            '.claude/plugins/dbt-quality-src/rust/**/Cargo.toml') }}
          restore-keys: dbt-quality-release-${{ matrix.target }}-rust196-
      - name: Build binaries
        run: |
          if ($IsWindows) {
            & ./scripts/build-plugin.ps1 -Target '${{ matrix.target }}'
          } else {
            & sh ./scripts/build-plugin.sh '${{ matrix.target }}'
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Package and test extracted artifact
        run: |
          $Output = Join-Path $env:RUNNER_TEMP 'dbt-quality-artifacts'
          & ./scripts/package.ps1 -Target '${{ matrix.target }}' -OutputDirectory $Output
          $Extracted = Join-Path $env:RUNNER_TEMP 'extracted package with spaces'
          New-Item -ItemType Directory -Force $Extracted | Out-Null
          $Name = 'dbt-quality-${{ matrix.target }}'
          if ($IsWindows) {
            Expand-Archive "$Output/$Name.zip" -DestinationPath $Extracted
          } else {
            & tar -xzf "$Output/$Name.tar.gz" -C $Extracted
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          & ./scripts/smoke-package.ps1 -PackageDirectory "$Extracted/$Name" -ScratchDirectory "$env:RUNNER_TEMP/dbt-quality-smoke"
      - name: Test plugin launcher download
        run: |
          & ./scripts/smoke-launcher.ps1 -ArchiveDirectory (Join-Path $env:RUNNER_TEMP 'dbt-quality-artifacts') -Target '${{ matrix.target }}' -ScratchDirectory "$env:RUNNER_TEMP/dbt-quality-launcher"
      - name: Upload tested archive and checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dbt-quality-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/dbt-quality-artifacts/*.tar.gz
            ${{ runner.temp }}/dbt-quality-artifacts/*.zip
            ${{ runner.temp }}/dbt-quality-artifacts/*.sha256
          if-no-files-found: error
          retention-days: 30

  # Catalog and vendor-pin checks do not depend on the target, so they run once.
  checks:
    name: Catalog and vendor pin
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: .claude/plugins/dbt-quality-src
    env: *rust-env
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          submodules: true
      - name: Install pinned Rust
        run: rustup toolchain install 1.96 --profile minimal
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .claude/plugins/dbt-quality-src/rust/target
          key:
            dbt-quality-checks-rust196-${{
            hashFiles('.claude/plugins/dbt-quality-src/rust/Cargo.lock',
            '.claude/plugins/dbt-quality-src/rust/**/Cargo.toml') }}
          restore-keys: dbt-quality-checks-rust196-
      - name: Check catalog and vendor pin
        run: scripts/check-dbt-pin.sh && scripts/check-catalog.sh

  browser:
    name: Report browser tests (Chromium)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: .claude/plugins/dbt-quality-src
    env:
      CI: "true"
      RUSTUP_TOOLCHAIN: "1.96"
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          submodules: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install pinned Rust
        run: rustup toolchain install 1.96 --profile minimal
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .claude/plugins/dbt-quality-src/rust/target
          key:
            dbt-quality-sample-rust196-${{
            hashFiles('.claude/plugins/dbt-quality-src/rust/Cargo.lock',
            '.claude/plugins/dbt-quality-src/rust/**/Cargo.toml') }}
          restore-keys: dbt-quality-sample-rust196-
      - name: Check generated synthetic sample
        run:
          cargo +1.96 run --locked --manifest-path rust/Cargo.toml -p dbt-quality-core --example
          sample_report -- --check
      - name: Install browser test dependencies
        run: npm --prefix tests/browser ci --ignore-scripts --no-audit --no-fund
      - name: Install Chromium and system libraries
        run: npm --prefix tests/browser run install:chromium -- --with-deps
      - name: Test report in Chromium
        run: npm --prefix tests/browser test
