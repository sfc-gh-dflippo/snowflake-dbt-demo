<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ETL Fixer Report — {unit_name}</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; margin: 2rem; color: #1a1a1a; background: #fafafa; max-width: 1200px; margin: 2rem auto; }
  h1 { border-bottom: 3px solid #0060df; padding-bottom: 0.5rem; }
  h2 { border-bottom: 1px solid #ccc; padding-bottom: 0.3rem; margin-top: 2rem; }
  h3 { margin-top: 1.5rem; }
  h4 { margin-top: 1rem; color: #444; }
  table { border-collapse: collapse; width: 100%; margin: 1rem 0; }
  th, td { border: 1px solid #ddd; padding: 0.5rem 0.75rem; text-align: left; font-size: 0.9rem; }
  th { background: #f0f0f0; font-weight: 600; }
  tr:nth-child(even) { background: #f9f9f9; }
  .badge { display: inline-block; padding: 0.15rem 0.5rem; border-radius: 3px; font-size: 0.8rem; font-weight: 600; }
  .badge-pass { background: #d4edda; color: #155724; }
  .badge-fail { background: #f8d7da; color: #721c24; }
  .badge-skip { background: #fff3cd; color: #856404; }
  .badge-new  { background: #cce5ff; color: #004085; }
  details { margin: 0.5rem 0; }
  summary { cursor: pointer; font-weight: 600; padding: 0.5rem; background: #f0f0f0; border-radius: 4px; }
  summary:hover { background: #e0e0e0; }
  .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1rem; margin: 1rem 0; }
  .stat-card { background: white; border: 1px solid #ddd; border-radius: 6px; padding: 1rem; text-align: center; }
  .stat-card .number { font-size: 2rem; font-weight: 700; }
  .stat-card .label { font-size: 0.85rem; color: #666; }
  .delta-pass { color: #155724; }
  .delta-fail { color: #721c24; }
  .delta-same { color: #666; }
  code { background: #e8e8e8; padding: 0.1rem 0.3rem; border-radius: 3px; font-size: 0.85rem; }
  pre { background: #2d2d2d; color: #f8f8f2; padding: 1rem; border-radius: 6px; overflow-x: auto; font-size: 0.85rem; }
  pre code { background: transparent; color: inherit; padding: 0; }
  ul { margin: 0.5rem 0; padding-left: 1.5rem; }
  li { margin: 0.25rem 0; }
  p { margin: 0.5rem 0; line-height: 1.5; }
</style>
</head>
<body>
</body>
</html>
