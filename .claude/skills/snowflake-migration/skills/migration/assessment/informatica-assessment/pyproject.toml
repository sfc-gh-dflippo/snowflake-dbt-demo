[project]
name = "informatica-assessment-analyzer"
version = "0.1.0"
description = "Informatica Power Center ETL assessment analyzer for migration planning"
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts/informatica_assessment_analyzer"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
