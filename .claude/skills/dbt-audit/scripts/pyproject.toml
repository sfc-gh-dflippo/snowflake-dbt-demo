[project]
name = "dbt-audit"
version = "0.1.0"
description = "Audit dbt projects for anti-patterns and produce an HTML quality assessment"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "Dan Flippo" }
]
keywords = ["dbt", "audit", "anti-patterns", "snowflake", "data-engineering", "quality"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Database",
]

dependencies = [
    "pyyaml>=6.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0",
]

[project.scripts]
dbt-audit = "dbt_audit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dbt_audit"]

[tool.hatch.build.targets.sdist]
include = [
    "src/dbt_audit",
    "README.md",
    "pyproject.toml",
]

[tool.ruff]
# Matches [tool.black] in the repo root pyproject.toml. The repo's pre-commit
# runs black, so ruff must agree on width or the two reformat each other.
line-length = 88
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
# E501 is delegated to black, matching the repo root pyproject.toml. Ruff resolves
# config from the nearest pyproject, so without this the package would re-enable a
# rule the repo deliberately turns off and fail its own pre-commit hook.
ignore = ["E501", "D100", "D104", "D107", "D203", "D213"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
