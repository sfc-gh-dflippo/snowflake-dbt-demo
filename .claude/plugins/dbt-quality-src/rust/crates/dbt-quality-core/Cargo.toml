[package]
name = "dbt-quality-core"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[features]
default = []
lexer-spike = ["dep:dbt-lexer-snowflake", "dep:dbt-sql-utils", "dep:dbt-frontend-common"]

[[example]]
name = "spike"
required-features = ["lexer-spike"]

[dependencies]
minijinja = { path = "../../../vendor/dbt/crates/dbt-jinja/minijinja", features = ["loader", "custom_syntax", "preserve_order", "unicode", "unstable_machinery"] }
dbt-lexer-snowflake = { path = "../../../vendor/dbt/crates/dbt-sql/dbt-lexer-snowflake", optional = true }
dbt-sql-utils = { path = "../../../vendor/dbt/crates/dbt-sql/dbt-sql-utils", optional = true }
dbt-frontend-common = { path = "../../../vendor/dbt/crates/dbt-frontend-common", optional = true }
dbt-yaml = { version = "0.10.6", features = ["filename", "yaml_11"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
regex = "1"
fancy-regex = "0.14"
sha2 = "0.10"
indexmap = "2"
similar = "2"
# Resolves to the sdf-labs fork through the root [patch.crates-io] block.
# No recursion guard (it pulls stacker/psm): CREATE TABLE DDL nests shallowly.
# Enable `recursive-protection` if deeply nested SQL is ever parsed.
sqlparser = { version = "0.58", default-features = false, features = ["std"] }
url = "2"

[build-dependencies]
serde_json = "1"
