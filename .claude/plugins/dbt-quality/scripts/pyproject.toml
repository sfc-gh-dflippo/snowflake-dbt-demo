[project]
name = "dbt-quality"
version = "0.1.0"
description = "Audit dbt projects for anti-patterns: project-wide quality assessment and per-file validation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "Dan Flippo" }
]
keywords = ["dbt", "audit", "validation", "anti-patterns", "snowflake", "data-engineering", "quality"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Database",
]

dependencies = [
    "pyyaml>=6.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0",
]

[project.scripts]
# Two entry points over one rule engine: a project-wide audit and a single-file
# check used by the editor hook. Both resolve the same rule registry, so a rule
# added once is available to both.
dbt-audit = "dbt_quality.cli:main"
dbt-validate = "dbt_quality.cli:validate_main"
dbt-lint = "dbt_quality.cli:lint_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dbt_quality"]

[tool.hatch.build.targets.sdist]
include = [
    "src/dbt_quality",
    "README.md",
    "pyproject.toml",
]

# Ruff and black configuration is inherited from the repo root pyproject.toml.
# Do not add a [tool.ruff] section here: ruff resolves config from the nearest
# pyproject.toml containing one, so a section here would replace the root config
# entirely rather than extend it -- which is how this package briefly ended up at
# a different line length with E501 re-enabled, failing the repo's own pre-commit
# hook. First-party src roots are registered in the root [tool.ruff] `src` list.
# Formatting is black (line-length 88), not `ruff format`.

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
